<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Licencias del personal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8b400'/%3E%3Cpath d='M9 8h4v13h9v4H9z' fill='%2317191c'/%3E%3C/svg%3E">
<style>
/* ============ 1. Tokens: todo valor visual sale de acá ============ */
:root{
  /* Neutrales cálidos (guiño al papel de la planilla) */
  --n-0:#ffffff; --n-25:#fbfaf7; --n-50:#f4f3ee; --n-100:#ebe8df; --n-200:#dcd8cd; --n-300:#c4bfb2;
  --n-500:#585e67; --n-700:#363b42; --n-900:#17191c;
  /* Acento único: el amarillo de la planilla. Sólo para la acción principal y lo seleccionado */
  --acento:#e8b400; --acento-h:#d6a600; --acento-suave:#fff5cc; --acento-linea:#efd98a; --acento-tinta:#4a3a00;
  /* Semánticos */
  --ok:#1b6e3f; --ok-suave:#e2f2e8;
  --warn:#7a4f00; --warn-suave:#fff0d1; --warn-linea:#f0d39a; --warn-barra:#c98200;
  --err:#a8200d; --err-suave:#fde7e3; --err-linea:#f0b9ae;
  /* Planilla */
  --trabajo:#fff3c2; --trabajo-linea:#e2b52a;
  --finde:#e4e0d5; --no-dia:#4a4f57; --feriado:#fbe9e6; --fila-hover:#fdf8e4;
  /* Barra superior */
  --top-fondo:#17191c; --top-tinta:#d7dade; --top-tenue:#a9aeb5; --top-hover:rgba(255,255,255,.08); --top-activo:rgba(255,255,255,.14); --top-campo:rgba(255,255,255,.1); --top-borde:rgba(255,255,255,.2);
  /* Grupos de artículos (categorías de datos) */
  --g-salud:#cde1f5; --g-salud-i:#0f3a63;
  --g-maternidad:#f7d2e2; --g-maternidad-i:#6d1840;
  --g-familiar:#e1d6f5; --g-familiar-i:#3f2470;
  --g-personales:#f8c38c; --g-personales-i:#5c3000;
  --g-capacitacion:#d3ebd2; --g-capacitacion-i:#1f5221;
  --g-sistema:#e3e3e3; --g-sistema-i:#33373d;
  --g-anual:#c7ebe6; --g-anual-i:#0c4f47;
  --g-sinaviso:#f3b1ab; --g-sinaviso-i:#6b0f06;
  /* Escalas */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.25rem; --t-xl:1.5rem; --t-2xl:2rem;
  --lh-apretado:1.15; --lh-medio:1.3; --lh-comodo:1.5;
  --r-sm:5px; --r-md:8px; --r-lg:14px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,20,20,.06),0 2px 8px rgba(20,20,20,.05);
  --sh-3:0 4px 8px rgba(0,0,0,.08),0 18px 48px rgba(0,0,0,.22);
  --velo:rgba(15,17,20,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* ============ 2. Base ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0;background:var(--n-50);color:var(--n-900);font:var(--t-md)/var(--lh-comodo) var(--font)}
h1,h2,h3{margin:0;line-height:var(--lh-apretado);font-weight:700}
h1{font-size:var(--t-xl);letter-spacing:-.01em} h2{font-size:var(--t-md)} h3{font-size:var(--t-md)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--n-900);text-underline-offset:3px}
.num,td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
:focus-visible{outline:2px solid var(--n-900);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;vertical-align:-3px}
.ico.sm{width:15px;height:15px;vertical-align:-2px}
/* ============ 3. Layout ============ */
.top{background:var(--top-fondo);color:var(--n-0);position:sticky;top:0;z-index:20}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s4);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s3);font-weight:700;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--top-tenue);font-size:var(--t-xs)}
.logo{width:30px;height:30px;border-radius:var(--r-md);border:2px solid var(--acento);display:grid;place-items:center;color:var(--acento);font-weight:800}
nav.tabs{display:flex;gap:2px}
nav.tabs a{color:var(--top-tinta);text-decoration:none;padding:var(--s2) var(--s3);border-radius:var(--r-md);font-weight:500;position:relative}
nav.tabs a[aria-current=page]{background:var(--top-activo);color:var(--n-0)}
nav.tabs a[aria-current=page]::after{content:"";position:absolute;left:var(--s3);right:var(--s3);bottom:-9px;height:3px;border-radius:3px 3px 0 0;background:var(--acento)}
.top-tools{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.top-tools input{background:var(--top-campo);border:1px solid var(--top-borde);color:var(--n-0);border-radius:var(--r-md);padding:var(--s2) var(--s3);width:220px;min-height:40px}
.top-tools input::placeholder{color:var(--top-tenue)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--top-borde);background:transparent;color:var(--top-tinta);border-radius:var(--r-full);padding:var(--s1) var(--s3);font-size:var(--t-xs);cursor:pointer;min-height:32px;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--top-tenue);flex:none}
.pill.ok .dot{background:#5cc98a}
.pill.warn{border-color:var(--acento)} .pill.warn .dot{background:var(--acento)}
.pill.err{border-color:#f08a7a} .pill.err .dot{background:#f08a7a}
main{max-width:1280px;margin:0 auto;padding:var(--s5) var(--s4) var(--s7)}
.banners{max-width:1280px;margin:0 auto;padding:var(--s3) var(--s4) 0;display:grid;gap:var(--s2)}
.banners:empty{display:none}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s4);align-items:start}
.stack{display:grid;gap:var(--s4)}
.stack.lg{gap:var(--s5)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.flex1{flex:1;min-width:0}
input.in.w-auto,select.in.w-auto,.w-auto{width:auto}
.w-busca{max-width:340px}
.cap::first-letter{text-transform:uppercase}
.t-lg{font-size:var(--t-lg)}
.span2{grid-column:span 2}
.al-fin{align-self:end}
.mt1{margin-top:var(--s1)}
/* ============ 4. Componentes ============ */
.card{background:var(--n-0);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card.plano{box-shadow:none;border:1px solid var(--n-100);border-radius:var(--r-md)}
.card-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--n-100);flex-wrap:wrap;min-height:52px}
.card-b{padding:var(--s4)}
.card-b.flush{padding:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--n-200);background:var(--n-0);border-radius:var(--r-md);padding:var(--s2) var(--s4);cursor:pointer;font-weight:600;font-size:var(--t-sm);min-height:40px;white-space:nowrap;text-decoration:none;color:var(--n-900);transition:background-color 120ms ease,border-color 120ms ease,transform 140ms var(--ease)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--n-900);border-color:var(--n-900);color:var(--n-0)}
.btn.accent{background:var(--acento);border-color:var(--acento);color:var(--n-900);font-weight:700}
.btn.danger{color:var(--err);border-color:var(--err-linea)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:var(--s1) var(--s3);font-size:var(--t-xs)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--n-500);transition:background-color 120ms ease,transform 140ms var(--ease)}
.iconbtn:active{transform:scale(.94)}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--n-500);font-size:var(--t-xs);font-weight:600;display:inline-flex;align-items:center;gap:2px;min-height:28px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--n-25);border-color:var(--n-300)}
  .btn.primary:hover{background:var(--n-700);border-color:var(--n-700)}
  .btn.accent:hover{background:var(--acento-h);border-color:var(--acento-h)}
  .btn.danger:hover{background:var(--err-suave)}
  .btn.ghost:hover{background:var(--n-50)}
  .iconbtn:hover{background:var(--n-50);color:var(--n-900)}
  .linkbtn:hover{color:var(--n-900)}
  nav.tabs a:hover{background:var(--top-hover);color:var(--n-0)}
  .pill:hover{background:var(--top-hover)}
  table.t tr.click:hover td,.lista li.click:hover,.semana .ent:hover,.semana .nota:hover{background:var(--fila-hover)}
  table.planilla td.d:hover{box-shadow:inset 0 0 0 2px var(--n-900)}
  .opcion:hover{border-color:var(--n-900)}
}
.chip{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--t-xs);font-weight:600;padding:2px var(--s2);border-radius:var(--r-full);background:var(--n-100);color:var(--n-700);white-space:nowrap;line-height:var(--lh-medio)}
.chip.doc{background:var(--n-0);box-shadow:inset 0 0 0 1px var(--n-300)}
.chip.psa{background:var(--n-100)}
.chip.warn{background:var(--warn-suave);color:var(--warn)}
.chip.err{background:var(--err-suave);color:var(--err)}
.chip.ok{background:var(--ok-suave);color:var(--ok)}
.art{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;font-size:var(--t-xs);font-weight:700;padding:2px 6px;border-radius:var(--r-sm);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:var(--lh-medio)}
.g-salud{background:var(--g-salud);color:var(--g-salud-i)}
.g-maternidad{background:var(--g-maternidad);color:var(--g-maternidad-i)}
.g-familiar{background:var(--g-familiar);color:var(--g-familiar-i)}
.g-personales{background:var(--g-personales);color:var(--g-personales-i)}
.g-capacitacion{background:var(--g-capacitacion);color:var(--g-capacitacion-i)}
.g-sistema{background:var(--g-sistema);color:var(--g-sistema-i)}
.g-anual{background:var(--g-anual);color:var(--g-anual-i)}
.g-sinaviso{background:var(--g-sinaviso);color:var(--g-sinaviso-i)}
.desglose{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3)}
.desglose span{display:inline-flex;align-items:center;gap:var(--s1);font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--t-sm)}
.muted{color:var(--n-500)}
.small{font-size:var(--t-sm)}
.xs{font-size:var(--t-xs)}
.big{font-size:var(--t-2xl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.banner{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);border-radius:var(--r-md);border:1px solid;flex-wrap:wrap;font-size:var(--t-sm)}
.banner.info{background:var(--n-0);border-color:var(--n-200)}
.banner.warn{background:var(--warn-suave);border-color:var(--warn-linea)}
.banner.err{background:var(--err-suave);border-color:var(--err-linea)}
.banner .txt{flex:1;min-width:220px}
main > .aviso-linea{margin-bottom:var(--s4)}
.aviso-linea{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--n-500);flex-wrap:wrap}
/* Tablas */
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--n-500);font-weight:600;text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--n-200);background:var(--n-25)}
table.t td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--n-100);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tfoot td{font-weight:700;background:var(--n-25);border-top:1px solid var(--n-200)}
th.sortable{cursor:pointer;user-select:none}
.vacio{padding:var(--s6) var(--s4);text-align:center;color:var(--n-500)}
.vacio b{display:block;color:var(--n-900);margin-bottom:var(--s1)}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--n-100)}
.lista li:last-child{border-bottom:0}
.lista li.click{cursor:pointer}
.nombre{font-weight:600}
.sub{font-size:var(--t-sm);color:var(--n-500)}
.bar{height:6px;background:var(--n-100);border-radius:var(--r-full);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--n-700)}
.bar.warn i{background:var(--warn-barra)}
.bar.err i{background:var(--err)}
/* Formularios */
label.f{display:grid;gap:var(--s1);font-size:var(--t-sm);font-weight:600;color:var(--n-700)}
label.f .hint{font-weight:400;color:var(--n-500);font-size:var(--t-xs)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--n-300);border-radius:var(--r-md);padding:var(--s2) var(--s3);background:var(--n-0);min-height:42px;font-weight:400;font-size:var(--t-md)}
textarea.in{min-height:64px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--n-900);outline:3px solid var(--acento-suave);outline-offset:0}
input.in.bad{border-color:var(--err)}
.err-msg{color:var(--err);font-size:var(--t-xs);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3)}
.fgrid .full{grid-column:1/-1}
.fgrid.checks{gap:0 var(--s3)}
.lbl{font-size:var(--t-sm);font-weight:600;color:var(--n-700);margin-bottom:var(--s1)}
.check{display:flex;gap:var(--s2);align-items:flex-start;font-size:var(--t-sm);cursor:pointer;padding:var(--s1) 0;min-height:32px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--n-900);flex:none}
.seg{display:inline-flex;border:1px solid var(--n-200);border-radius:var(--r-md);overflow:hidden;background:var(--n-0)}
.seg button{border:0;background:transparent;padding:var(--s2) var(--s3);cursor:pointer;font-weight:600;font-size:var(--t-sm);min-height:38px}
.seg button[aria-pressed=true]{background:var(--n-900);color:var(--n-0)}
.datenav{display:flex;align-items:center;gap:var(--s1)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:var(--velo);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh var(--s3);overflow:auto;animation:fade 160ms ease-out}
.modal{background:var(--n-0);border-radius:var(--r-lg);width:100%;max-width:780px;box-shadow:var(--sh-3);display:flex;flex-direction:column;max-height:92vh;animation:entrar 180ms var(--ease)}
.modal.sm{max-width:480px}
.modal-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s5);border-bottom:1px solid var(--n-100)}
.modal-h h2{font-size:var(--t-lg)}
.modal-b{padding:var(--s5);overflow:auto;display:grid;gap:var(--s4)}
.modal-f{display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s5);border-top:1px solid var(--n-100);background:var(--n-25);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes entrar{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes subir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.resumen-lic{border-radius:var(--r-md);padding:var(--s3) var(--s4);background:var(--n-25);border:1px solid var(--n-100);display:grid;gap:6px}
.computo{font-size:var(--t-md)}
.computo b{font-size:var(--t-lg);font-variant-numeric:tabular-nums}
.msg{display:flex;gap:var(--s2);font-size:var(--t-sm);padding:6px var(--s3);border-radius:var(--r-md);align-items:flex-start}
.msg .ico{margin-top:1px}
.msg.err{background:var(--err-suave);color:var(--err)}
.msg.warn{background:var(--warn-suave);color:var(--warn)}
.msg.ok{background:var(--ok-suave);color:var(--ok)}
.msg.info{background:var(--n-50);color:var(--n-700)}
.ayuda-art{font-size:var(--t-sm);background:var(--acento-suave);border:1px solid var(--acento-linea);border-radius:var(--r-md);padding:var(--s2) var(--s3);color:var(--acento-tinta)}
.ayuda-art details summary{cursor:pointer;font-weight:600;margin-top:var(--s1)}
/* Toast */
.toast{position:fixed;right:var(--s5);bottom:var(--s5);background:var(--n-900);color:var(--n-0);padding:var(--s3) var(--s4);border-radius:var(--r-md);display:flex;gap:var(--s3);align-items:center;z-index:60;box-shadow:var(--sh-3);font-size:var(--t-sm);max-width:min(440px,calc(100vw - 32px));animation:subir 200ms var(--ease)}
.toast button{background:transparent;border:0;color:var(--acento);font-weight:700;cursor:pointer;padding:var(--s1);min-height:32px}
/* Planilla anual */
.planilla-wrap{overflow:auto}
table.planilla{border-collapse:collapse;font-size:var(--t-sm);font-variant-numeric:tabular-nums;width:100%;table-layout:fixed}
table.planilla th,table.planilla td{border:1px solid var(--n-200);text-align:center;padding:0;height:32px;width:30px}
table.planilla thead th{background:var(--n-25);font-weight:600;color:var(--n-500);font-size:var(--t-xs)}
table.planilla th.mes{text-align:left;padding:0 var(--s2);width:112px;position:sticky;left:0;background:var(--n-25);z-index:1;font-weight:700;font-size:var(--t-xs);letter-spacing:.04em;color:var(--n-700)}
table.planilla td.d{cursor:pointer;font-weight:700}
table.planilla td.trab{background:var(--trabajo);box-shadow:inset 0 -4px 0 var(--trabajo-linea)}
table.planilla td.fs{background:var(--finde)}
table.planilla td.nd{background:var(--no-dia);cursor:default}
table.planilla td.fer{color:var(--err);background:var(--feriado)}
table.planilla td.fs.fer{background:var(--finde)}
table.planilla td.nocuenta{opacity:.5}
table.planilla td.sup{box-shadow:inset 0 0 0 2px var(--err)}
table.planilla td.hoy{box-shadow:inset 0 0 0 2px var(--n-900)}
table.planilla td.obs,table.planilla th.obs{display:none}
.planilla-pie{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:flex-start;padding:var(--s3) var(--s4);border-top:1px solid var(--n-100)}
.leyenda{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:var(--t-xs);align-items:center;color:var(--n-700)}
.leyenda .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--n-200);vertical-align:-2px;margin-right:var(--s1)}
.leyenda .sw.finde{background:var(--finde)}
.leyenda .sw.trab{background:var(--trabajo);border-color:var(--trabajo-linea)}
.leyenda b.f{color:var(--err)}
details.feriados{font-size:var(--t-sm)}
details.feriados summary{cursor:pointer;font-weight:600;color:var(--n-700)}
details.feriados ul{columns:2 260px;margin:var(--s2) 0 0;padding-left:var(--s4);color:var(--n-700)}
/* Semana */
.semana{display:grid;grid-template-columns:repeat(5,1fr)}
.semana .dia{border-right:1px solid var(--n-100);min-height:140px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.semana .dia:last-child{border-right:0}
.semana .dia.hoy{background:var(--acento-suave)}
.semana .dia h4{margin:0 0 var(--s1);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--n-500);font-weight:600}
.semana .dia h4 b{color:var(--n-900);font-size:var(--t-md);margin-left:2px;letter-spacing:0}
.semana .ent,.semana .nota{font-size:var(--t-sm);line-height:var(--lh-medio);display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:var(--r-sm);padding:2px}

@media (max-width:1000px){

}
@media (max-width:720px){

/* =========================================================================
   3. ESTADO Y PERSISTENCIA
   -------------------------------------------------------------------------
   Capa de datos pensada para pasar a online sin reescribir la app:
   - Toda modificación pasa por mutar() → un único punto para mandar cambios a un servidor.
   - Cada registro tiene id (UUID), creado, modificado y borrado (borrado lógico),
     que es lo que necesita una sincronización por registro.
   - El almacenamiento está separado en "adaptadores": localStorage (siempre) y
     Archivo (JSON en una carpeta, por ej. Google Drive / OneDrive de escritorio).
     Un adaptador futuro "Servidor" sólo tiene que implementar leer() / escribir().
   ========================================================================= */
function sellar(obj) { const t = ahora(); return { id: uid(), creado: t, modificado: t, borrado: false, ...obj }; }

function estadoInicial() {
  const t = ahora();
  return {
    version: SCHEMA_VERSION,
    meta: { institucion: '', creado: t, modificado: t, rev: 0, ultimoBackup: null, semillaArticulos: 1 },
    config: { feriadosCuentanHabiles: false },
    articulos: SEED_ARTICULOS.map(a => ({ ...a, creado: t, modificado: t, borrado: false })),
    calendario: SEED_CALENDARIO.map(c => ({ ...c, creado: t, modificado: t, borrado: false })),
    agentes: [],
    licencias: [],
    notas: [],
  };
}

function esEstadoValido(d) {
  return d && typeof d === 'object' && Array.isArray(d.agentes) && Array.isArray(d.licencias)
    && Array.isArray(d.articulos) && Array.isArray(d.calendario);
}

function migrar(datos, { persistir = true } = {}) {
  const version = datos.version ?? 1;
  if (version > SCHEMA_VERSION) throw new Error('Los datos son de una versión más nueva de la app. Actualizá la app antes de abrirlos.');
  let d = datos;
  if (version < SCHEMA_VERSION && persistir) {
    try { LS.setItem(`${STORAGE_KEY}-backup-v${version}`, JSON.stringify(datos)); } catch (e) { /* sin espacio: seguimos */ }
  }
  if (version < 2) d = migrarA2(d);
  if (version < 3) d = migrarA3(d);
  if (version < 4) d = migrarA4(d);
  // (futuras migraciones en cascada: if (version < 3) d = migrarA3(d); …)
  d.meta = { institucion: '', rev: 0, ultimoBackup: null, semillaArticulos: 1, ...d.meta };
  d.config = { feriadosCuentanHabiles: false, ...d.config };
  d.version = SCHEMA_VERSION;
  return d;
}

/* v4: las casillas de trámite pasan a ser tres para todas las licencias:
   solicitud, cargado en SAGE y elevado a UG */
function migrarA4(d) {
  const t = ahora();
  (d.articulos || []).forEach(a => {
    const nuevas = a.codigo === 'S/A' ? ['sage', 'ug'] : ['solicitud', 'sage', 'ug'];
    if (JSON.stringify(a.tramites || []) !== JSON.stringify(nuevas)) { a.tramitesAnteriores = a.tramites || []; a.tramites = nuevas; a.modificado = t; }
  });
  return d;
}
function migrarA3(d) {
  const t = ahora();
  const seed = new Map(SEED_ARTICULOS.map(a => [a.id, a]));
  const viejo = (d.articulos || []).find(a => a.id === '233-20' && !a.borrado);
  if (!(d.articulos || []).some(a => a.id === '233-20a')) {
    ['233-20a', '233-20b'].forEach(id => { const a = seed.get(id); if (a) d.articulos.push({ ...a, creado: t, modificado: t, borrado: false }); });
  }
  if (viejo) {
    let n = 0;
    (d.licencias || []).forEach(l => { if (l.articuloId === '233-20') { l.articuloId = '233-20b'; l.migradoDe = '233-20'; l.modificado = t; if (!l.borrado) n++; } });
    viejo.borrado = true; viejo.modificado = t;
    if (n) d.meta = { ...d.meta, avisoArt20: n };
  }
  (d.agentes || []).forEach(a => (a.cargos || []).forEach(c => { if (!c.horario || typeof c.horario !== 'object') c.horario = {}; }));
  return d;
}
function migrarA2(d) {
  const cortos = new Map(SEED_ARTICULOS.map(a => [a.id, a.corto]));
  (d.articulos || []).forEach(a => { if (a.corto == null) a.corto = cortos.get(a.id) || a.nombre; });
  if (!Array.isArray(d.notas)) d.notas = [];
  return d;
}

/* =========================================================================
   4. LÓGICA DE DOMINIO (funciones puras)
   ========================================================================= */
function contexto(e = estado) {
  const arts = new Map(e.articulos.filter(a => !a.borrado).map(a => [a.id, a]));
  const calIdx = new Map(vivos(e.calendario).map(c => [c.fecha, c]));
  const agentes = vivos(e.agentes);
  const agIdx = new Map(agentes.map(a => [a.id, a]));
  const licencias = vivos(e.licencias).filter(l => agIdx.has(l.agenteId));
  const notas = vivos(e.notas);
  return { arts, calIdx, cfg: e.config, agentes, agIdx, licencias, notas };
}
function esHabil(iso, ctx) {
  const w = dow(iso);
  if (w === 0 || w === 6) return false;
  if (!ctx.cfg.feriadosCuentanHabiles && ctx.calIdx.has(iso)) return false;
  return true;
}
function cuentaDia(iso, art, ctx) { return (art?.unidad === 'corridos') ? true : esHabil(iso, ctx); }
/* Días computables de una licencia, opcionalmente recortada a [desde, hasta] */
function diasLicencia(lic, art, ctx, desde = null, hasta = null) {
  let a = lic.desde, b = lic.hasta;
  if (desde && a < desde) a = desde;
  if (hasta && b > hasta) b = hasta;
  if (!a || !b || a > b) return 0;
  let n = 0;
  for (let d = a; d <= b; d = sumarDias(d, 1)) if (cuentaDia(d, art, ctx)) n++;
  return n;
}
/* Fecha final para "cantidad" días computables desde 'desde' */
function calcularHasta(desde, cant, art, ctx) {
  if (!esISO(desde) || !(cant >= 1)) return null;
  let n = 0, d = desde;
  for (let i = 0; i < 2000; i++) {
    if (cuentaDia(d, art, ctx)) { n++; if (n === cant) return d; }
    d = sumarDias(d, 1);
  }
  return null;
}
/* Uso de un artículo por un agente en un año: total y por mes */
function usoArticulo(agenteId, artId, anio, ctx, { hastaFecha = null, excluirId = null } = {}) {
  const art = ctx.arts.get(artId);
  const ini = `${anio}-01-01`; let fin = `${anio}-12-31`;
  if (hastaFecha && hastaFecha < fin) fin = hastaFecha;
  const porMes = Array(12).fill(0); let total = 0, cantidad = 0;
  for (const l of ctx.licencias) {
    if (l.agenteId !== agenteId || l.articuloId !== artId || l.id === excluirId) continue;
    if (l.hasta < ini || l.desde > fin) continue;
    cantidad++;
    const a = l.desde < ini ? ini : l.desde, b = l.hasta > fin ? fin : l.hasta;
    for (let d = a; d <= b; d = sumarDias(d, 1)) if (cuentaDia(d, art, ctx)) { total++; porMes[Number(d.slice(5, 7)) - 1]++; }
  }
  return { total, porMes, cantidad };
}
/* Días hábiles distintos en que el agente estuvo ausente (cualquier artículo) */
function diasAusencia(agenteId, desde, hasta, ctx) {
  const set = new Set();
  for (const l of ctx.licencias) {
    if (l.agenteId !== agenteId || l.hasta < desde || l.desde > hasta) continue;
    const a = l.desde < desde ? desde : l.desde, b = l.hasta > hasta ? hasta : l.hasta;
    for (let d = a; d <= b; d = sumarDias(d, 1)) if (esHabil(d, ctx)) set.add(d);
  }
  return set.size;
}
function resumenAgente(ag, anio, aFecha, ctx) {
  const filas = [];
  for (const art of ctx.arts.values()) {
    if (art.regimen !== ag.regimen) continue;
    const u = usoArticulo(ag.id, art.id, anio, ctx, { hastaFecha: aFecha });
    const tieneTope = art.topeAnual != null;
    if (u.cantidad === 0 && !tieneTope) continue;
    filas.push({ art, ...u, tope: art.topeAnual, disponibles: tieneTope ? art.topeAnual - u.total : null });
  }
  filas.sort((x, y) => (y.total > 0) - (x.total > 0) || ordenArt(x.art, y.art));
  return filas;
}
function ordenArt(a, b) {
  const n = s => { const m = String(s.codigo).match(/\d+/); return m ? Number(m[0]) : 999; };
  return n(a) - n(b) || String(a.codigo).localeCompare(String(b.codigo));
}
function licenciasDelDia(iso, ctx) { return ctx.licencias.filter(l => l.desde <= iso && l.hasta >= iso); }
function vencimientoSolicitud(lic, art, ctx) {
  if (!CON_PLAZO_SOLICITUD.has(art.id)) return null;
  const total = diasLicencia(lic, art, ctx);
  if (total >= 10) return { fecha: calcularHasta(lic.desde, 5, art, ctx), texto: 'Dentro de los primeros 5 días de ausencia' };
  return { fecha: sumarDias(lic.hasta, 1), texto: 'Al retornar a las tareas' };
}
function tramitesPendientes(lic, art) { return (art?.tramites || []).filter(k => !(lic.tramites || {})[k]); }

/* Validación completa de una licencia antes de guardar */
function validarLicencia(b, ctx) {
  const errores = [], avisos = [], info = [];
  const ag = ctx.agIdx.get(b.agenteId);
  const art = ctx.arts.get(b.articuloId);
  if (!ag) errores.push('Elegí el agente.');
  if (!art) errores.push('Elegí el artículo.');
  if (!esISO(b.desde)) errores.push('Falta la fecha de inicio.');
  if (!esISO(b.hasta)) errores.push('Falta la fecha de fin (o la cantidad de días).');
  if (errores.length) return { errores, avisos, info, dias: 0 };
  if (b.hasta < b.desde) { errores.push('La fecha de fin es anterior a la de inicio.'); return { errores, avisos, info, dias: 0 }; }
  if (isoToDate(b.hasta) - isoToDate(b.desde) > 3 * 366 * 864e5) errores.push('El rango supera los 3 años: revisá las fechas.');
  if (art.regimen !== ag.regimen) errores.push(`El art. ${art.codigo} es de ${REGIMENES[art.regimen].largo} y el agente es ${REGIMENES[ag.regimen].corto}.`);
  const dias = diasLicencia(b, art, ctx);
  if (dias === 0) avisos.push('El rango no tiene días computables (sólo fines de semana o feriados).');
  if (art.maxPorLicencia != null && dias > art.maxPorLicencia) avisos.push(`El art. ${art.codigo} admite hasta ${art.maxPorLicencia} ${unidadTxt(art.unidad, art.maxPorLicencia)} por licencia; esta tiene ${dias}.`);
  // Topes anuales y mensuales, por cada año que toca la licencia
  for (let y = anioDe(b.desde); y <= anioDe(b.hasta); y++) {
    const u = usoArticulo(ag.id, art.id, y, ctx, { excluirId: b.id });
    const estaAnio = diasLicencia(b, art, ctx, `${y}-01-01`, `${y}-12-31`);
    if (art.topeAnual != null) {
      const quedan = art.topeAnual - u.total;
      const despues = u.total + estaAnio;
      if (despues > art.topeAnual) avisos.push(`Supera el tope anual del art. ${art.codigo} en ${y}: ya lleva ${u.total} de ${art.topeAnual}; con esta quedaría en ${despues} (${despues - art.topeAnual} de más).`);
      else info.push(`Art. ${art.codigo} en ${y}: lleva ${u.total} de ${art.topeAnual}. Con esta: ${despues}. Le quedarían ${quedan - estaAnio}.`);
    }
    if (art.topeMensual != null) {
      const porMesEsta = Array(12).fill(0);
      const a = b.desde < `${y}-01-01` ? `${y}-01-01` : b.desde, z = b.hasta > `${y}-12-31` ? `${y}-12-31` : b.hasta;
      for (let d = a; d <= z; d = sumarDias(d, 1)) if (cuentaDia(d, art, ctx)) porMesEsta[Number(d.slice(5, 7)) - 1]++;
      porMesEsta.forEach((n, m) => {
        if (n && u.porMes[m] + n > art.topeMensual) avisos.push(`Supera el máximo mensual del art. ${art.codigo} en ${MESES[m].toLowerCase()} ${y}: ${u.porMes[m] + n} de ${art.topeMensual}.`);
      });
    }
  }
  // Superposición con otras licencias del mismo agente
  const sup = ctx.licencias.filter(l => l.agenteId === ag.id && l.id !== b.id && l.desde <= b.hasta && l.hasta >= b.desde);
  sup.forEach(l => { const a2 = ctx.arts.get(l.articuloId); avisos.push(`Se superpone con otra licencia del agente: art. ${a2 ? a2.codigo : '?'} del ${fmt(l.desde)} al ${fmt(l.hasta)}.`); });
  // Alta / baja de los cargos
  const cargos = vivos(ag.cargos);
  const elegidos = (b.cargos && b.cargos.length) ? cargos.filter(c => b.cargos.includes(c.id)) : cargos;
  elegidos.forEach(c => {
    if (c.alta && b.desde < c.alta) avisos.push(`Empieza antes del alta del cargo "${c.catedra || c.idCargo || 'sin nombre'}" (${fmt(c.alta)}).`);
    if (c.baja && b.desde > c.baja) avisos.push(`Empieza después de la baja del cargo "${c.catedra || c.idCargo || 'sin nombre'}" (${fmt(c.baja)}).`);
  });
  return { errores, avisos, info, dias, art, ag };
}

/* Horario de trabajo: cargos vigentes que trabajan ese día (lunes=1 … sábado=6) */
function turnosDelDia(ag, iso) {
  const w = dow(iso);
  const out = [];
  for (const c of vivos(ag?.cargos)) {
    const h = (c.horario || {})[w];
    if (!h) continue;
    if (c.alta && iso < c.alta) continue;
    if (c.baja && iso > c.baja) continue;
    out.push({ cargo: c, desde: h.desde || '', hasta: h.hasta || '' });
  }
  return out;
}
function tieneHorario(ag) { return vivos(ag?.cargos).some(c => c.horario && Object.keys(c.horario).length); }
function textoTurnos(ts) {
  return ts.map(t => `${t.desde && t.hasta ? `${t.desde}–${t.hasta}` : 'sin horario'}${t.cargo.catedra ? ' (' + t.cargo.catedra + ')' : ''}`).join(' · ');
}
function resumenHorario(c) {
  const h = c.horario || {};
  return [1, 2, 3, 4, 5, 6].filter(d => h[d]).map(d => `${DIAS_C[d]} ${h[d].desde && h[d].hasta ? h[d].desde + '–' + h[d].hasta : ''}`.trim()).join(' · ');
}
/* Días de trabajo (según horario) dentro de una licencia, sin contar feriados */
function diasDeTrabajoEn(lic, ag, ctx) {
  if (!tieneHorario(ag) || !esISO(lic.desde) || !esISO(lic.hasta) || lic.hasta < lic.desde) return null;
  let n = 0;
  for (let d = lic.desde; d <= lic.hasta; d = sumarDias(d, 1)) if (!ctx.calIdx.has(d) && turnosDelDia(ag, d).length) n++;
  return n;
}

/* Alertas de topes para el panel de inicio */
function alertasTopes(anio, ctx) {
  const out = [];
  for (const ag of ctx.agentes) {
    for (const art of ctx.arts.values()) {
      if (art.regimen !== ag.regimen || art.topeAnual == null) continue;
      const u = usoArticulo(ag.id, art.id, anio, ctx);
      if (u.total === 0) continue;
      const p = u.total / art.topeAnual;
      if (p >= 0.75) out.push({ ag, art, total: u.total, tope: art.topeAnual, p });
    }
  }
  return out.sort((a, b) => b.p - a.p);
}

/* =========================================================================
   5. RENDER
   ========================================================================= */
const ui = {
  vista: 'inicio', agenteId: null, fecha: hoyISO(), anio: new Date().getFullYear(), aFecha: null,
  busqueda: '', filtroReg: '', verInactivos: false, orden: 'nombre',
  rep: { desde: null, hasta: null, reg: '', art: '' },
  ajustesTab: 'datos', artReg: '233', calAnio: new Date().getFullYear(),
};

function artBadge(art, conNombre = false) {
  if (!art) return '<span class="art g-sistema">?</span>';
  return `<span class="art g-${esc(art.grupo)}" title="${esc('Art. ' + art.codigo + ' — ' + art.nombre)}">${esc(art.codigo)}</span>${conNombre ? ` <span class="small">${esc(artNombre(art))}</span>` : ''}`;
}
function regChip(reg) { const r = REGIMENES[reg]; return r ? `<span class="chip ${r.cls}">${r.corto}</span>` : ''; }
function fmtFechaHora(iso) { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function barra(total, tope) {
  if (tope == null) return '';
  const p = tope ? Math.min(1, total / tope) : 1;
  const cls = total > tope ? 'err' : p >= 0.75 ? 'warn' : '';
  return `<div class="bar ${cls}" title="${total} de ${tope}"><i style="width:${Math.round(p * 100)}%"></i></div>`;
}

/* Navegación: no depende de que el navegador procese los links con # (en algunas vistas previas no lo hace) */
let rutaActual = (location.hash || '#inicio').slice(1);
function ir(ruta) {
  rutaActual = String(ruta || 'inicio').replace(/^#/, '');
  try { history.replaceState(null, '', '#' + rutaActual); } catch (e) { /* vista aislada: seguimos igual */ }
  window.scrollTo(0, 0);
  render();
}
function render() {
  const h = rutaActual || 'inicio';
  const [v, id] = h.split('/');
  ui.vista = ['inicio', 'agentes', 'agente', 'reportes', 'ajustes'].includes(v) ? v : 'inicio';
  ui.agenteId = v === 'agente' ? decodeURIComponent(id || '') : null;
  $$('#nav a').forEach(a => a.toggleAttribute('aria-current', false));
  const navV = ui.vista === 'agente' ? 'agentes' : ui.vista;
  const act = $(`#nav a[data-v="${navV}"]`); if (act) act.setAttribute('aria-current', 'page');
  $('#inst-nombre').textContent = estado.meta.institucion || (modoLectura ? 'Modo consulta' : '');
  $('#btn-nueva').hidden = modoLectura;
  const ctx = contexto();
  $('#dl-agentes').innerHTML = ctx.agentes.map(a => `<option value="${esc(etiquetaAgente(a))}">`).join('');
  let html = '';
  if (modoLectura && Consulta.estado === 'requiere-permiso') html = vistaPermisoConsulta();
  else if (ui.vista === 'inicio') html = (!modoLectura && ctx.agentes.length === 0 && !ctx.notas.length) ? vistaBienvenida() : vistaInicio(ctx);
  else if (ui.vista === 'agentes') html = vistaAgentes(ctx);

  $('#main').innerHTML = (ui.vista !== 'inicio' ? avisoEjemplo(ctx) : '') + html;
  renderBanners();

function pintarEstadoGuardado() {
  const el = $('#pill-respaldo'); if (!el || !estado) return;
  const hh = d => d ? ` · ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  let cls = '', txt = '';
  if (modoLectura) { cls = ''; txt = 'Modo consulta' + hh(Consulta.cargado); }
  else if (Archivo.estado === 'conectado') { cls = 'ok'; txt = 'Guardado en archivo' + hh(Archivo.ultimaEscritura); }
  else if (['requiere-permiso', 'error', 'conflicto'].includes(Archivo.estado)) { cls = 'err'; txt = 'Archivo desconectado'; }
  else {
    const hay = vivos(estado.agentes).length > 0;
    const ult = estado.meta.ultimoBackup;
    const dias = ult ? Math.floor((Date.now() - new Date(ult)) / 864e5) : null;
    if (hay && (dias == null || dias >= 7)) { cls = 'warn'; txt = 'Sin respaldo'; } else { txt = 'Guardado en este navegador'; }
  }
  el.className = 'pill ' + cls;
  el.title = txt + ' — tocá para ver las opciones de respaldo';
  el.querySelector('.txt').textContent = txt;
}
function abrirRespaldo() {
  if (modoLectura) { if (Consulta.handle) cargarConsulta(true).then(() => toast('Datos actualizados.')); else $('#file-consulta').click(); return; }
  const conectado = Archivo.estado === 'conectado';
  const ult = estado.meta.ultimoBackup;
  const m = abrirModal(`<div class="modal-h"><h2>Respaldo de los datos</h2><span class="spacer"></span><button class="iconbtn" data-x="no" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="modal-b">
      ${conectado ? `<div class="msg ok">${ico('check', 'sm')}<span>Cada cambio se guarda en <b>${esc(Archivo.nombre)}</b>. Si está en una carpeta de Google Drive u OneDrive, queda respaldado en la nube.</span></div>`
        : `<div class="msg warn">${ico('alerta', 'sm')}<span>Los datos están <b>sólo en este navegador</b>. Si se borra el historial, se pierden. ${ult ? 'Última copia exportada: ' + fmtFechaHora(ult) + '.' : 'Nunca se exportó una copia.'}</span></div>`}
      <div class="row">
        ${Archivo.soportado && !conectado ? `<button class="btn primary" data-x="vincular">${ico('archivo')}Guardar en un archivo</button>` : ''}
        <button class="btn" data-x="exportar">Exportar copia (.json)</button>
        <button class="btn ghost" data-x="ajustes">Más opciones</button>
      </div></div>`, { chico: true });
  m.querySelector('[data-x=no]').onclick = () => cerrarModal();
  const v = m.querySelector('[data-x=vincular]'); if (v) v.onclick = () => { cerrarModal(); vincularArchivoNuevo(); };
  m.querySelector('[data-x=exportar]').onclick = () => { cerrarModal(); exportarJSON(); toast('Copia descargada.'); };
  m.querySelector('[data-x=ajustes]').onclick = () => { cerrarModal(); ui.ajustesTab = 'datos'; ir('ajustes'); };
}

    if (Archivo.estado === 'conflicto') b.push(`<div class="banner err">${ico('alerta')}<div class="txt"><b>El archivo de datos cambió desde otra computadora</b> mientras trabajabas acá. Elegí qué datos quedan.</div><button class="btn sm" data-act="conflicto-archivo">Usar los del archivo</button><button class="btn sm danger" data-act="conflicto-mios">Sobrescribir con los míos</button></div>`);

  $('#banners').innerHTML = b.join('');

  const ausentes = hoyL.map(l => {
    const ag = ctx.agIdx.get(l.agenteId), art = ctx.arts.get(l.articuloId);

    const c = ctx.calIdx.get(d);

    const ns = ctx.notas.filter(n => n.fecha === d).sort((a, b) => a.creado.localeCompare(b.creado));

      ${ls.map(l => { const ag = ctx.agIdx.get(l.agenteId), art = ctx.arts.get(l.articuloId); return `<div class="ent" data-act="ver-agente" data-id="${ag.id}" title="${esc(nombreAgente(ag) + ' · Art. ' + (art?.codigo || '') + ' ' + artNombre(art))}">${artBadge(art)}<span>${esc(nombreBreve(ag))}</span></div>`; }).join('')}
      ${ns.map(n => `<div class="nota" ${modoLectura ? '' : `data-act="editar-nota" data-id="${n.id}"`} title="Nota">${ico('nota', 'sm')}<span>${esc(n.texto)}</span></div>`).join('')}
      ${!ls.length && !ns.length && !c ? '<span class="xs muted">Sin licencias</span>' : ''}
      ${modoLectura ? '' : `<div class="mas"><button class="linkbtn" data-act="nueva-nota" data-fecha="${d}">${ico('mas', 'sm')}Nota</button></div>`}

  }).filter(x => x.faltan.length).sort((a, b) => b.l.desde.localeCompare(a.l.desde));
  const pendHtml = pend.slice(0, 8).map(({ l, art, faltan, venc }) => {

      <div class="flex1"><div class="nombre">${esc(nombreAgente(a.ag))}</div><div class="sub">${esc(artNombre(a.art))}</div>${barra(a.total, a.tope)}</div>

  return `<div class="stack lg">

    ${avisoEjemplo(ctx)}
    ${fer ? `<div class="msg warn">${ico('info', 'sm')}<span><b>${esc(TIPOS_DIA[fer.tipo])}:</b> ${esc(fer.desc)}</span></div>` : ''}

        <section class="card"><div class="card-h"><h2>Notas del día</h2><span class="spacer"></span>${modoLectura ? '' : `<button class="btn sm" data-act="nueva-nota" data-fecha="${f}">${ico('mas', 'sm')}Nota</button>`}</div>
          ${notasHoy.length ? `<ul class="lista notas-dia">${notasHoy.map(n => `<li class="${modoLectura ? '' : 'click'}" ${modoLectura ? '' : `data-act="editar-nota" data-id="${n.id}"`}>${ico('nota')}<span class="flex1">${esc(n.texto)}</span></li>`).join('')}</ul>`

      <button class="iconbtn" data-act="dia" data-n="-7" aria-label="Semana anterior">${ico('izq')}</button><button class="iconbtn" data-act="dia" data-n="7" aria-label="Semana siguiente">${ico('der')}</button></div>

function vistaAgentes(ctx) {
  return `<div class="stack">
    <div class="row"><h1>Agentes</h1><span class="muted" id="cuenta-agentes"></span><span class="spacer"></span>

    <div class="card card-b flush" id="lista-agentes">${listaAgentes(ctx)}</div></div>`;

function listaAgentes(ctx) {
  const q = normalizar(ui.busqueda);
  const hoy = hoyISO();
  const ausentesHoy = new Set(licenciasDelDia(hoy, ctx).map(l => l.agenteId));
  const ini = `${ui.anio}-01-01`, fin = `${ui.anio}-12-31` < hoy || anioDe(hoy) !== ui.anio ? `${ui.anio}-12-31` : hoy;
  let ags = ctx.agentes.filter(a => (ui.verInactivos || !a.inactivo) && (!ui.filtroReg || a.regimen === ui.filtroReg));
  if (q) ags = ags.filter(a => normalizar([a.apellido, a.nombre, a.dni, a.cuil, ...vivos(a.cargos).map(c => c.catedra + ' ' + c.idCargo + ' ' + c.cursoDiv)].join(' ')).includes(q));
  const filas = ags.map(a => {
    const aus = diasAusencia(a.id, ini, fin, ctx);
    const usados = new Set(ctx.licencias.filter(l => l.agenteId === a.id && l.hasta >= ini && l.desde <= fin).map(l => l.articuloId));
    const det = [...usados].map(id => ctx.arts.get(id)).filter(Boolean).sort(ordenArt)
      .map(art => ({ art, n: usoArticulo(a.id, art.id, ui.anio, ctx, { hastaFecha: fin }).total })).filter(x => x.n > 0);
    const exced = [...ctx.arts.values()].some(art => art.regimen === a.regimen && art.topeAnual != null && usoArticulo(a.id, art.id, ui.anio, ctx).total > art.topeAnual);
    return { a, det, aus, exced };
  });
  if (ui.orden === 'dias') filas.sort((x, y) => y.aus - x.aus || nombreAgente(x.a).localeCompare(nombreAgente(y.a)));
  else filas.sort((x, y) => nombreAgente(x.a).localeCompare(nombreAgente(y.a), 'es'));
  setTimeout(() => { const c = $('#cuenta-agentes'); if (c) c.textContent = plural(filas.length, 'agente'); });
  if (!ctx.agentes.length) return `<div class="vacio"><b>Todavía no hay agentes cargados.</b>${modoLectura ? '' : 'Tocá "Nuevo agente" para cargar el primero.'}</div>`;
  if (!filas.length) return `<div class="vacio"><b>Ningún agente coincide con la búsqueda.</b>Probá con otro apellido o sacá los filtros.</div>`;
  return `<table class="t cards"><thead><tr>
    <th class="sortable" data-act="orden" data-v="nombre">Apellido y nombre ${ui.orden === 'nombre' ? '▲' : ''}</th><th class="hide-m">Régimen</th><th class="hide-m">Cargo / cátedra</th>
    <th class="num sortable" data-act="orden" data-v="dias">Días ausente ${ui.orden === 'dias' ? '▼' : ''}</th><th>Por artículo (${ui.anio}${fin < `${ui.anio}-12-31` ? ', al ' + fmtC(fin) : ''})</th><th class="hide-m">Estado</th></tr></thead><tbody>
    ${filas.map(({ a, det, aus, exced }) => {
      const c = vivos(a.cargos);

function leyenda(ag, lics, ctx) {
  const grupos = [...new Set(lics.map(l => ctx.arts.get(l.articuloId)?.grupo).filter(Boolean))];
  return `<div class="leyenda">${grupos.map(g => `<span><i class="sw g-${g}"></i>${GRUPOS[g]}</span>`).join('')}
    ${tieneHorario(ag) ? '<span><i class="sw trab"></i>Días que trabaja</span>' : ''}<span><i class="sw finde"></i>Fin de semana</span><span><b class="f">F</b> feriado · <b class="f">A</b> asueto · <b class="f">N</b> no laborable</span></div>`;
}
function listaFeriados(anio, ctx) {
  const fs = [...ctx.calIdx.values()].filter(c => anioDe(c.fecha) === anio).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (!fs.length) return `<span class="xs muted">Sin feriados cargados para ${anio} (se agregan en Ajustes).</span>`;
  return `<details class="feriados"><summary>Feriados y asuetos ${anio} (${fs.length})</summary><ul>${fs.map(c => `<li><b class="num">${fmtC(c.fecha)}</b> ${esc(TIPOS_DIA[c.tipo])}: ${esc(c.desc)}</li>`).join('')}</ul></details>`;
}
function planillaAnual(ag, anio, ctx, { interactiva = true, imprimir = false } = {}) {
  const lics = ctx.licencias.filter(l => l.agenteId === ag.id && l.hasta >= `${anio}-01-01` && l.desde <= `${anio}-12-31`);
  const porDia = new Map();
  for (const l of lics) {
    const a = l.desde < `${anio}-01-01` ? `${anio}-01-01` : l.desde, b = l.hasta > `${anio}-12-31` ? `${anio}-12-31` : l.hasta;
    for (let d = a; d <= b; d = sumarDias(d, 1)) { const prev = porDia.get(d); porDia.set(d, prev ? { l, sup: true } : { l, sup: false }); }
  }
  const hoy = hoyISO();
  let h = `<table class="planilla"><thead><tr><th class="mes">${imprimir ? '' : 'Mes'}</th>${Array.from({ length: 31 }, (_, i) => `<th>${pad(i + 1)}</th>`).join('')}<th class="obs izq">Observaciones</th></tr></thead><tbody>`;
  for (let m = 0; m < 12; m++) {
    const dm = diasEnMes(anio, m);
    h += `<tr><th class="mes">${MESES[m].toUpperCase()}</th>`;
    const obs = [];
    for (let d = 1; d <= 31; d++) {
      if (d > dm) { h += '<td class="nd"></td>'; continue; }
      const iso = `${anio}-${pad(m + 1)}-${pad(d)}`;
      const w = dow(iso); const fs = w === 0 || w === 6;
      const c = ctx.calIdx.get(iso);
      if (c) obs.push(`${c.tipo} ${d}: ${c.desc}`);
      const x = porDia.get(iso);
      const cls = ['d']; let txt = '', title = `${DIAS_C[w]} ${fmt(iso)}`;
      if (fs) cls.push('fs');
      const turnos = turnosDelDia(ag, iso);
      if (turnos.length && !c) { cls.push('trab'); title += ` · Trabaja: ${textoTurnos(turnos)}`; }
      if (iso === hoy && !imprimir) cls.push('hoy');
      if (x) {
        const art = ctx.arts.get(x.l.articuloId);
        cls.push('g-' + (art?.grupo || 'sistema'));
        if (!cuentaDia(iso, art, ctx)) cls.push('nocuenta');
        if (x.sup) cls.push('sup');
        txt = codigoCorto(art);
        title += ` · Art. ${art?.codigo} ${artNombre(art)} (${fmt(x.l.desde)} al ${fmt(x.l.hasta)})${x.sup ? ' · SUPERPUESTA con otra licencia' : ''}`;
      } else if (c) { cls.push('fer'); txt = c.tipo; title += ` · ${TIPOS_DIA[c.tipo]}: ${c.desc}`; }
      const data = interactiva ? (x ? `data-act="editar-licencia" data-id="${x.l.id}"` : `data-act="licencia-desde" data-fecha="${iso}" data-agente="${ag.id}"`) : '';
      h += `<td class="${cls.join(' ')}" title="${esc(title)}" ${data}>${esc(txt)}</td>`;
    }
    h += `<td class="obs">${esc(obs.join(' · '))}</td></tr>`;
  }
  return h + '</tbody></table>';
}

          <td>${x.faltan.length ? `<span class="chip warn" title="${esc(x.faltan.map(k => tramLabel(k)).join(', '))}">Faltan ${x.faltan.length}</span>` : (x.art?.tramites?.length ? '<span class="chip ok">Completo</span>' : '—')}</td></tr>`).join('')}
        </tbody></table>` : '<div class="vacio"><b>Sin licencias en el período.</b></div>'}</section>` : ''}

function datosReporte(ctx) {
  const { desde, hasta, reg, art } = ui.rep;
  const lista = ctx.licencias.filter(l => l.hasta >= desde && l.desde <= hasta && (!art || l.articuloId === art))
    .map(l => { const ag = ctx.agIdx.get(l.agenteId); const a = ctx.arts.get(l.articuloId); return { l, ag, art: a, dias: diasLicencia(l, a, ctx, desde, hasta), faltan: tramitesPendientes(l, a) }; })
    .filter(x => !reg || x.ag.regimen === reg)
    .sort((a, b) => nombreAgente(a.ag).localeCompare(nombreAgente(b.ag), 'es') || a.l.desde.localeCompare(b.l.desde));
  const m = new Map();
  for (const x of lista) {
    if (!m.has(x.ag.id)) m.set(x.ag.id, { ag: x.ag, n: 0, det: new Map() });
    const r = m.get(x.ag.id); r.n++;
    const d = r.det.get(x.art.id) || { art: x.art, dias: 0 }; d.dias += x.dias; r.det.set(x.art.id, d);
  }
  const porAgente = [...m.values()].map(r => ({ ...r, det: [...r.det.values()].sort((a, b) => ordenArt(a.art, b.art)), aus: art ? r.det.get(art)?.dias || 0 : diasAusencia(r.ag.id, desde, hasta, ctx) }))
    .sort((a, b) => nombreAgente(a.ag).localeCompare(nombreAgente(b.ag), 'es'));
  return { lista, porAgente };
}
function csv(filas) {
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return '﻿' + filas.map(f => f.map(q).join(';')).join('\r\n');
}

/* =========================================================================
   5b. MODALES Y FORMULARIOS

let modalCerrar = null;
function abrirModal(html, { chico = false, alCerrar = null } = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal ${chico ? 'sm' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalCerrar = alCerrar;
  const bg = root.firstElementChild;
  bg.addEventListener('mousedown', e => { if (e.target === bg) cerrarModal(); });
  setTimeout(() => { const f = root.querySelector('[autofocus]') || root.querySelector('input,select,textarea,button'); if (f) f.focus(); }, 30);
  return root.querySelector('.modal');
}
function cerrarModal(valor) { const cb = modalCerrar; modalCerrar = null; $('#modal-root').innerHTML = ''; if (cb) cb(valor); }
function confirmar({ titulo, html, ok = 'Aceptar', peligro = false }) {
  return new Promise(res => {
    const m = abrirModal(`<div class="modal-h"><h2>${esc(titulo)}</h2></div><div class="modal-b">${html}</div>
      <div class="modal-f"><span class="spacer"></span><button class="btn" data-x="no">Cancelar</button><button class="btn ${peligro ? 'danger' : 'primary'}" data-x="si" autofocus>${esc(ok)}</button></div>`, { chico: true, alCerrar: v => res(!!v) });
    m.querySelector('[data-x=no]').onclick = () => cerrarModal(false);
    m.querySelector('[data-x=si]').onclick = () => cerrarModal(true);
  });
}
let toastTimer = null;
function toast(texto, deshacer = null) {
  const r = $('#toast-root');
  r.innerHTML = `<div class="toast" role="status"><span>${esc(texto)}</span>${deshacer ? '<button data-x="undo">Deshacer</button>' : ''}</div>`;
  if (deshacer) r.querySelector('[data-x=undo]').onclick = () => { r.innerHTML = ''; deshacer(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, deshacer ? 7000 : 3500);
}

/* ---------- Formulario de licencia ---------- */
function formLicencia({ id = null, agenteId = '', desde = '' } = {}) {
  if (modoLectura) return;
  const ctx = contexto();
  if (!ctx.agentes.length) { toast('Primero cargá al menos un agente.'); return abrirFormAgente(); }
  const existente = id ? estado.licencias.find(l => l.id === id && !l.borrado) : null;
  const b = existente ? structuredClone(existente) : { id: null, agenteId, articuloId: '', desde: desde || hoyISO(), hasta: '', cargos: [], tramites: {}, obs: '' };
  if (!existente && b.agenteId) {
    // por defecto, el último artículo usado para ese agente no: arrancar vacío obliga a elegir conscientemente
  }
  const m = abrirModal(`<div class="modal-h"><h2>${existente ? 'Editar licencia' : 'Nueva licencia'}</h2><span class="spacer"></span><button class="iconbtn" data-x="cerrar" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="modal-b">
      <div class="fgrid">
        <label class="f full">Agente<input class="in" list="dl-agentes" data-f="agente" placeholder="Escribí el apellido…" autocomplete="off" ${b.agenteId ? '' : 'autofocus'} enterkeyhint="next"></label>
        <label class="f full">Artículo<select class="in" data-f="articulo" ${b.agenteId && !existente ? 'autofocus' : ''}></select></label>
        <div class="full ayuda-art" data-f="ayuda" hidden></div>
        <label class="f">Desde<input type="date" class="in" data-f="desde" value="${esc(b.desde)}"></label>
        <label class="f"><span>Cantidad de <span data-f="unidad">días</span></span><input class="in num" inputmode="numeric" data-f="cant" placeholder="ej.: 3" enterkeyhint="next"></label>
        <label class="f">Hasta<input type="date" class="in" data-f="hasta" value="${esc(b.hasta)}"></label>
        <div class="full resumen-lic" data-f="resumen" aria-live="polite"></div>
        <div class="full" data-f="cargos-wrap" hidden><div class="lbl">Cargos afectados</div><div data-f="cargos"></div></div>
        <div class="full" data-f="tram-wrap" hidden><div class="lbl">Trámite <span class="xs muted" data-f="plazo"></span></div><div data-f="tramites" class="fgrid checks"></div></div>
        <label class="f full">Observaciones<textarea class="in" data-f="obs" placeholder="Opcional">${esc(b.obs)}</textarea></label>
      </div>
    </div>
    <div class="modal-f">
      ${existente ? '<button class="btn danger" data-x="borrar">Borrar</button>' : ''}<span class="small" data-f="pie"></span><span class="spacer"></span>
      <button class="btn" data-x="cerrar">Cancelar</button>
      ${existente ? '' : '<button class="btn" data-x="otra">Guardar y cargar otra</button>'}
      <button class="btn primary" data-x="guardar">Guardar</button></div>`);
  const F = k => m.querySelector(`[data-f="${k}"]`);
  const agInput = F('agente'), artSel = F('articulo');
  const agPorEtiqueta = new Map(ctx.agentes.map(a => [etiquetaAgente(a), a]));
  if (b.agenteId) { const a = ctx.agIdx.get(b.agenteId); if (a) agInput.value = etiquetaAgente(a); }
  let ultimaCant = null;

  function agenteActual() {
    const v = agInput.value.trim();
    if (agPorEtiqueta.has(v)) return agPorEtiqueta.get(v);
    const q = normalizar(v); if (!q) return null;
    const cands = ctx.agentes.filter(a => normalizar(etiquetaAgente(a)).includes(q));
    return cands.length === 1 ? cands[0] : null;
  }
  function llenarArticulos() {
    const ag = agenteActual();
    const prev = artSel.value || b.articuloId;
    if (!ag) { artSel.innerHTML = '<option value="">Primero elegí el agente</option>'; artSel.disabled = true; return; }
    artSel.disabled = false;
    const arts = [...ctx.arts.values()].filter(a => a.regimen === ag.regimen).sort(ordenArt);
    const grupos = new Map();
    arts.forEach(a => { const g = a.capitulo || GRUPOS[a.grupo]; if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(a); });
    // los usados por este agente este año, primero
    const usados = [...new Set(ctx.licencias.filter(l => l.agenteId === ag.id).sort((x, y) => y.desde.localeCompare(x.desde)).map(l => l.articuloId))].slice(0, 4).map(i => ctx.arts.get(i)).filter(a => a && a.regimen === ag.regimen);
    artSel.innerHTML = '<option value="">Elegí el artículo…</option>' +
      (usados.length ? `<optgroup label="Usados últimamente por este agente">${usados.map(a => `<option value="${a.id}">${esc(a.codigo)} — ${esc(artNombre(a))}</option>`).join('')}</optgroup>` : '') +
      [...grupos.entries()].map(([g, as]) => `<optgroup label="${esc(g)}">${as.map(a => `<option value="${a.id}">${esc(a.codigo)} — ${esc(artNombre(a))}</option>`).join('')}</optgroup>`).join('');
    if (prev && arts.some(a => a.id === prev)) artSel.value = prev;
  }
  function llenarCargos() {
    const ag = agenteActual(); const cs = ag ? vivos(ag.cargos) : [];
    F('cargos-wrap').hidden = cs.length < 2;
    const sel = b.cargos && b.cargos.length ? b.cargos : cs.map(c => c.id);
    F('cargos').innerHTML = cs.map(c => `<label class="check"><input type="checkbox" value="${c.id}" ${sel.includes(c.id) ? 'checked' : ''}> ${esc(c.catedra || c.idCargo || 'Cargo')} ${c.cursoDiv ? '· ' + esc(c.cursoDiv) : ''} ${c.hs ? '· ' + esc(c.hs) + ' hs' : ''}</label>`).join('');
  }
  function llenarTramites() {
    const art = ctx.arts.get(artSel.value);
    const ks = art?.tramites || [];
    F('tram-wrap').hidden = !ks.length;
    const marcados = {}; $$('input', F('tramites')).forEach(i => { marcados[i.value] = i.checked; });
    F('tramites').innerHTML = ks.map(k => `<label class="check"><input type="checkbox" value="${k}" ${(marcados[k] ?? b.tramites?.[k]) ? 'checked' : ''}> ${esc(tramLabel(k))}</label>`).join('');
  }
  function leer() {
    const ag = agenteActual();
    const cs = $$('input', F('cargos')).filter(i => i.checked).map(i => i.value);
    const tr = {}; $$('input', F('tramites')).forEach(i => { if (i.checked) tr[i.value] = true; });
    return { ...b, agenteId: ag ? ag.id : '', articuloId: artSel.value, desde: F('desde').value, hasta: F('hasta').value, cargos: ag && vivos(ag.cargos).length > 1 ? cs : [], tramites: tr, obs: F('obs').value.trim() };
  }
  function actualizar(origen) {
    const ctx2 = contexto();
    const art = ctx2.arts.get(artSel.value);
    F('unidad').textContent = art ? unidadTxt(art.unidad, 2) : 'días';
    const ay = F('ayuda');
    if (art) {
      ay.hidden = false;
      ay.innerHTML = `<b>Art. ${esc(art.codigo)} — ${esc(artNombre(art))}.</b> ${art.tiempo && art.tiempo !== '—' ? esc(art.tiempo) : ''}
        <div class="mt1">Cuenta en ${unidadTxt(art.unidad, 2)}${art.topeAnual != null ? ` · tope ${art.topeAnual} por año` : ''}${art.topeMensual != null ? ` · máx. ${art.topeMensual} por mes` : ''}${art.maxPorLicencia != null ? ` · hasta ${art.maxPorLicencia} por licencia` : ''}.</div>
        ${art.nombre !== artNombre(art) || art.reglamentacion ? `<details><summary>Texto completo y trámite</summary><div class="mt1">${esc(art.nombre)}.</div>${art.reglamentacion ? `<div class="mt1">${esc(art.reglamentacion)}</div>` : ''}</details>` : ''}`;
    } else ay.hidden = true;
    // cantidad ↔ hasta
    const desde = F('desde').value;
    if (origen === 'cant') {
      const n = parseEntero(F('cant').value);
      if (art && n >= 1 && esISO(desde)) { const h = calcularHasta(desde, n, art, ctx2); if (h) F('hasta').value = h; }
    } else if (art && esISO(desde) && esISO(F('hasta').value) && F('hasta').value >= desde) {
      if (origen === 'desde' && ultimaCant) { const h = calcularHasta(desde, ultimaCant, art, ctx2); if (h) F('hasta').value = h; }
      F('cant').value = diasLicencia({ desde, hasta: F('hasta').value }, art, ctx2);
    }
    const nCant = parseEntero(F('cant').value); ultimaCant = nCant >= 1 ? nCant : ultimaCant;
    const v = validarLicencia(leer(), ctx2);
    const ag = agenteActual();
    // plazo de la solicitud
    const lic = leer();
    const venc = art && esISO(lic.desde) && esISO(lic.hasta) ? vencimientoSolicitud(lic, art, ctx2) : null;
    F('plazo').textContent = venc ? `· Solicitud: ${venc.texto.toLowerCase()} (hasta el ${fmt(venc.fecha)})` : '';
    let h = '';
    if (!ag && agInput.value.trim()) h += `<div class="msg err">No encuentro ese agente. Elegilo de la lista que aparece al escribir.</div>`;
    if (art && esISO(lic.desde) && esISO(lic.hasta) && lic.hasta >= lic.desde) {
      h += `<div class="computo"><b>${v.dias}</b> ${unidadTxt(art.unidad, v.dias)} · del ${fmtLargo(lic.desde)} al ${fmtLargo(lic.hasta)}</div>`;
      const fer = []; for (let d = lic.desde; d <= lic.hasta && fer.length < 6; d = sumarDias(d, 1)) { const c = ctx2.calIdx.get(d); if (c) fer.push(`${fmtC(d)} ${c.desc}`); }
      if (fer.length && art.unidad === 'habiles') h += `<div class="small muted">No se cuentan: ${esc(fer.join(' · '))}.</div>`;
      const dt = ag ? diasDeTrabajoEn(lic, ag, ctx2) : null;
      if (dt != null) h += `<div class="small">Según su horario, le toca trabajar <b>${dt}</b> ${dt === 1 ? 'día' : 'días'} de ese período.</div>`;
    }
    h += v.errores.map(e => `<div class="msg err">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('');
    h += v.avisos.map(e => `<div class="msg warn">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('');
    h += v.info.map(e => `<div class="msg info">${ico('info', 'sm')}<span>${esc(e)}</span></div>`).join('');
    F('resumen').innerHTML = h || '<span class="muted small">Completá agente, artículo y fechas para ver el cómputo de días.</span>';
    const nA = v.avisos.length, nE = v.errores.length;
    F('pie').innerHTML = (v.dias && art ? `<b class="num">${v.dias}</b> ${unidadTxt(art.unidad, v.dias)} ` : '') + (nE ? `<span class="chip err">${plural(nE, 'error', 'errores')}</span> ` : '') + (nA ? `<span class="chip warn">${plural(nA, 'aviso')}</span>` : '');
    return v;
  }
  llenarArticulos(); llenarCargos(); llenarTramites();
  if (b.articuloId) artSel.value = b.articuloId;
  llenarTramites();
  actualizar('init');

  agInput.addEventListener('change', () => { llenarArticulos(); llenarCargos(); llenarTramites(); actualizar('ag'); });
  agInput.addEventListener('input', () => { if (agPorEtiqueta.has(agInput.value)) { llenarArticulos(); llenarCargos(); llenarTramites(); actualizar('ag'); artSel.focus(); } });
  artSel.addEventListener('change', () => { llenarTramites(); actualizar('art'); F('cant').focus(); });
  F('desde').addEventListener('change', () => actualizar('desde'));
  F('hasta').addEventListener('change', () => { ultimaCant = null; actualizar('hasta'); });
  F('cant').addEventListener('input', () => actualizar('cant'));
  F('cargos').addEventListener('change', () => actualizar('cargos'));

  function guardarLic(otra) {
    const v = actualizar('guardar');
    if (v.errores.length) { toast('Revisá los datos marcados en rojo.'); return; }
    const datos = leer();
    let guardada;
    mutar(e => {
      if (existente) {
        const l = e.licencias.find(x => x.id === existente.id);
        Object.assign(l, { agenteId: datos.agenteId, articuloId: datos.articuloId, desde: datos.desde, hasta: datos.hasta, cargos: datos.cargos, tramites: datos.tramites, obs: datos.obs });
        tocar(l); guardada = l;
      } else {
        guardada = sellar({ agenteId: datos.agenteId, articuloId: datos.articuloId, desde: datos.desde, hasta: datos.hasta, cargos: datos.cargos, tramites: datos.tramites, obs: datos.obs });
        e.licencias.push(guardada);
      }
    }, { msg: existente ? 'Licencia actualizada.' : `Licencia guardada: ${v.dias} ${unidadTxt(v.art.unidad, v.dias)}.` });
    if (otra) formLicencia({ agenteId: datos.agenteId, desde: sumarDias(datos.hasta, 1) });
    else cerrarModal();
  }
  m.querySelectorAll('[data-x=cerrar]').forEach(x => x.onclick = () => cerrarModal());
  m.querySelector('[data-x=guardar]').onclick = () => guardarLic(false);
  const otraBtn = m.querySelector('[data-x=otra]'); if (otraBtn) otraBtn.onclick = () => guardarLic(true);
  const borrarBtn = m.querySelector('[data-x=borrar]');
  if (borrarBtn) borrarBtn.onclick = async () => {
    const ctx3 = contexto(); const art = ctx3.arts.get(existente.articuloId); const ag = ctx3.agIdx.get(existente.agenteId);
    const d = diasLicencia(existente, art, ctx3);
    const ok = await confirmar({ titulo: 'Borrar licencia', html: `<p>Se borra la licencia <b>art. ${esc(art?.codigo)}</b> de <b>${esc(nombreAgente(ag))}</b> del ${fmt(existente.desde)} al ${fmt(existente.hasta)} (${d} ${unidadTxt(art?.unidad, d)}).</p>`, ok: 'Borrar licencia', peligro: true });
    if (!ok) return;
    mutar(e => { tocar(e.licencias.find(x => x.id === existente.id)).borrado = true; }, {
      msg: 'Licencia borrada.', deshacer: () => mutar(e => { tocar(e.licencias.find(x => x.id === existente.id)).borrado = false; }, { msg: 'Licencia recuperada.' }),
    });
  };
  m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) guardarLic(false); });
}

/* ---------- Notas por día (como el planificador semanal) ---------- */
function abrirNota({ id = null, fecha = null } = {}) {
  if (modoLectura) return;
  const ex = id ? estado.notas.find(n => n.id === id && !n.borrado) : null;
  const f = ex ? ex.fecha : (fecha || ui.fecha);
  const m = abrirModal(`<div class="modal-h"><h2>${ex ? 'Editar nota' : 'Nueva nota'}</h2><span class="spacer"></span><button class="iconbtn" data-x="cerrar" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="modal-b">
      <label class="f">Día<input type="date" class="in" data-f="fecha" value="${esc(f)}"></label>
      <label class="f">Nota<textarea class="in" data-f="texto" rows="4" placeholder="Ej.: Reunión de personal 10 hs · Avisar a Pérez que traiga el certificado" autofocus>${esc(ex ? ex.texto : '')}</textarea></label>
      <div data-f="err"></div></div>
    <div class="modal-f">${ex ? '<button class="btn danger" data-x="borrar">Borrar</button>' : ''}<span class="spacer"></span><button class="btn" data-x="cerrar">Cancelar</button><button class="btn primary" data-x="guardar">Guardar nota</button></div>`, { chico: true });
  m.querySelectorAll('[data-x=cerrar]').forEach(b => b.onclick = () => cerrarModal());
  const guardarNota = () => {
    const fecha2 = m.querySelector('[data-f=fecha]').value, texto = m.querySelector('[data-f=texto]').value.trim();
    if (!esISO(fecha2) || !texto) { m.querySelector('[data-f=err]').innerHTML = `<div class="msg err">${ico('alerta', 'sm')}<span>Completá el día y el texto de la nota.</span></div>`; return; }
    cerrarModal();
    mutar(e => {
      if (!Array.isArray(e.notas)) e.notas = [];
      if (ex) { const n = e.notas.find(x => x.id === ex.id); n.fecha = fecha2; n.texto = texto; tocar(n); }
      else e.notas.push(sellar({ fecha: fecha2, texto }));
    }, { msg: ex ? 'Nota actualizada.' : 'Nota guardada.' });
  };
  m.querySelector('[data-x=guardar]').onclick = guardarNota;
  m.querySelector('[data-f=texto]').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) guardarNota(); });
  const bb = m.querySelector('[data-x=borrar]');
  if (bb) bb.onclick = () => {
    cerrarModal();
    mutar(e => { tocar(e.notas.find(x => x.id === ex.id)).borrado = true; }, { msg: 'Nota borrada.', deshacer: () => mutar(e => { tocar(e.notas.find(x => x.id === ex.id)).borrado = false; }, { msg: 'Nota recuperada.' }) });
  };
}

  if (modoLectura) return;
  const existente = id ? estado.agentes.find(a => a.id === id && !a.borrado) : null;
  const a = existente ? structuredClone(existente) : { apellido: '', nombre: '', regimen: '233', cargos: [] };
  const cargos = vivos(a.cargos);
  if (!cargos.length) cargos.push({ id: uid(), catedra: '', hs: '', cursoDiv: '', idCargo: '', caracter: '', resDisp: '', alta: '', baja: '', obs: '' });
  const nLics = existente ? vivos(estado.licencias).filter(l => l.agenteId === id).length : 0;
  const campo = (k, label, extra = '') => `<label class="f">${label}<input class="in" data-a="${k}" value="${esc(a[k] || '')}" ${extra}></label>`;

      <label class="f">Horas<input class="in num" inputmode="numeric" data-c="hs" value="${esc(c.hs)}"></label>

      <label class="f">Alta<input type="date" class="in" data-c="alta" value="${esc(c.alta)}"></label>

      <label class="f span2">Observaciones<input class="in" data-c="obs" value="${esc(c.obs)}"></label>
      <div class="full"><div class="lbl">Días y horario de trabajo <span class="xs muted">(marcá los días; el horario es opcional)</span></div>
        <div class="hgrid">${[1, 2, 3, 4, 5, 6].map(d => { const h = (c.horario || {})[d]; return `<div class="hdia ${h ? 'on' : ''}" data-hdia="${d}">
          <label><input type="checkbox" data-h="on" ${h ? 'checked' : ''}>${DIAS[d]}</label>
          <input type="time" class="in" data-h="desde" value="${esc(h?.desde || '')}" aria-label="Desde" ${h ? '' : 'disabled'}>
          <input type="time" class="in" data-h="hasta" value="${esc(h?.hasta || '')}" aria-label="Hasta" ${h ? '' : 'disabled'}></div>`; }).join('')}</div></div>
      <div class="row al-fin"><button class="btn sm danger" type="button" data-x="quitar-cargo">Quitar cargo</button></div></div>`;
  const m = abrirModal(`<div class="modal-h"><h2>${existente ? 'Editar agente' : 'Nuevo agente'}</h2><span class="spacer"></span><button class="iconbtn" data-x="cerrar" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="modal-b">
      <div class="fgrid">
        <label class="f">Apellido<input class="in" data-a="apellido" value="${esc(a.apellido)}" autofocus enterkeyhint="next"></label>
        <label class="f">Nombre<input class="in" data-a="nombre" value="${esc(a.nombre)}" enterkeyhint="next"></label>
        <label class="f">Régimen<select class="in" data-a="regimen" ${nLics ? 'disabled title="Tiene licencias cargadas: no se puede cambiar el régimen"' : ''}>${Object.entries(REGIMENES).map(([k, r]) => `<option value="${k}" ${a.regimen === k ? 'selected' : ''}>${r.largo}</option>`).join('')}</select></label>
        ${campo('dni', 'DNI', 'inputmode="numeric"')}${campo('cuil', 'CUIL', 'placeholder="20-12345678-9"')}
        ${campo('fechaNac', 'Fecha de nacimiento', 'type="date"')}
        ${campo('domicilio', 'Domicilio')}${campo('telefono', 'Teléfono', 'inputmode="tel"')}${campo('email', 'Email', 'type="email"')}
        ${campo('legajoPersonal', 'Legajo personal')}${campo('legajoJunta', 'Legajo de junta')}${campo('titulo', 'Título')}
        <label class="f full">Observaciones<textarea class="in" data-a="obs">${esc(a.obs || '')}</textarea></label>
        <label class="check full"><input type="checkbox" data-a="inactivo" ${a.inactivo ? 'checked' : ''}> Dado de baja / ya no trabaja en la institución (se oculta de la lista, pero conserva su historial)</label>
      </div>
      <div class="row"><h3>Cargos</h3><span class="spacer"></span><button class="btn sm" type="button" data-x="agregar-cargo">${ico('mas', 'sm')}Agregar cargo</button></div>
      <div class="stack" data-f="cargos">${cargos.map(filaCargo).join('')}</div>

    </div>
    <div class="modal-f">${existente ? '<button class="btn danger" data-x="borrar">Borrar agente</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-x="cerrar">Cancelar</button><button class="btn primary" data-x="guardar">${existente ? 'Guardar cambios' : 'Guardar agente'}</button></div>`);
  m.querySelectorAll('[data-x=cerrar]').forEach(x => x.onclick = () => cerrarModal());
  m.querySelector('[data-x=agregar-cargo]').onclick = () => {
    const div = document.createElement('div'); div.innerHTML = filaCargo({ id: uid(), catedra: '', hs: '', cursoDiv: '', idCargo: '', caracter: '', resDisp: '', alta: '', baja: '', obs: '' });
    m.querySelector('[data-f=cargos]').appendChild(div.firstElementChild);
  };
  m.querySelector('[data-f=cargos]').addEventListener('click', e => { if (e.target.dataset.x === 'quitar-cargo') e.target.closest('[data-cargo]').remove(); });
  m.querySelector('[data-f=cargos]').addEventListener('change', e => {
    if (e.target.dataset.h !== 'on') return;
    const box = e.target.closest('[data-hdia]'); const on = e.target.checked;
    box.classList.toggle('on', on);
    $$('input[type=time]', box).forEach(i => { i.disabled = !on; });
    if (on) box.querySelector('[data-h=desde]').focus();
  });
  const leer = () => {
    const o = {}; $$('[data-a]', m).forEach(i => { o[i.dataset.a] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
    o.cargos = $$('[data-cargo]', m).map(div => {
      const c = { id: div.dataset.cargo }; $$('[data-c]', div).forEach(i => { c[i.dataset.c] = i.value.trim(); });
      c.horario = {};
      $$('[data-hdia]', div).forEach(b => { if (b.querySelector('[data-h=on]').checked) c.horario[b.dataset.hdia] = { desde: b.querySelector('[data-h=desde]').value, hasta: b.querySelector('[data-h=hasta]').value }; });
      return c;
    }).filter(c => c.catedra || c.idCargo || c.hs || c.cursoDiv || c.alta || c.resDisp || Object.keys(c.horario).length);
    return o;
  };
  m.querySelector('[data-x=guardar]').onclick = () => {
    const o = leer();
    const err = [], av = [];
    if (!o.apellido) err.push('Falta el apellido.');
    if (!o.nombre) err.push('Falta el nombre.');
    if (o.dni && !/^\d{7,8}$/.test(o.dni.replace(/\./g, ''))) av.push('El DNI debería tener 7 u 8 números.');
    if (o.cuil && !/^\d{2}-?\d{7,8}-?\d$/.test(o.cuil)) av.push('El CUIL no tiene el formato 20-12345678-9.');
    const dni = o.dni.replace(/\./g, '');
    const dup = dni && vivos(estado.agentes).find(x => x.id !== id && (x.dni || '').replace(/\./g, '') === dni);
    if (dup) err.push(`Ya hay un agente con DNI ${dni}: ${nombreAgente(dup)}.`);
    o.cargos.forEach(c => {
      if (c.alta && c.baja && c.baja < c.alta) err.push(`En el cargo "${c.catedra || c.idCargo}", la baja es anterior al alta.`);
      Object.entries(c.horario).forEach(([d, h]) => {
        if (h.desde && h.hasta && h.hasta <= h.desde) err.push(`En el cargo "${c.catedra || c.idCargo || 'sin nombre'}", el ${DIAS[d]} la hora de salida es anterior a la de entrada.`);
        if (!!h.desde !== !!h.hasta) av.push(`En el cargo "${c.catedra || c.idCargo || 'sin nombre'}", el ${DIAS[d]} tiene sólo una de las dos horas.`);
      });
    });
    const msgs = m.querySelector('[data-f=msgs]');
    msgs.innerHTML = err.map(e => `<div class="msg err">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('') + av.map(e => `<div class="msg warn">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('');
    if (err.length) { msgs.scrollIntoView({ block: 'nearest' }); return; }
    if (av.length && !m.dataset.avisado) { m.dataset.avisado = '1'; msgs.insertAdjacentHTML('beforeend', '<div class="msg info">Si está bien así, tocá Guardar de nuevo.</div>'); return; }
    o.dni = dni;
    let nuevoId = id;
    mutar(e => {
      if (existente) {
        const ag = e.agentes.find(x => x.id === id);
        const viejos = new Map((ag.cargos || []).map(c => [c.id, c]));
        const nuevos = o.cargos.map(c => viejos.has(c.id) ? tocar(Object.assign(viejos.get(c.id), c)) : sellar(c));
        const quitados = (ag.cargos || []).filter(c => !o.cargos.some(n => n.id === c.id)).map(c => ({ ...c, borrado: true, modificado: ahora() }));
        Object.assign(ag, { ...o, regimen: nLics ? ag.regimen : o.regimen, cargos: [...nuevos, ...quitados] }); tocar(ag);
      } else {
        const ag = sellar({ ...o, cargos: o.cargos.map(c => sellar(c)) }); nuevoId = ag.id; e.agentes.push(ag);
      }
    }, { msg: existente ? 'Datos actualizados.' : 'Agente guardado.', redibujar: false });
    cerrarModal();
    if (!existente) ir('#agente/' + nuevoId); else render();
  };
  const bb = m.querySelector('[data-x=borrar]');
  if (bb) bb.onclick = async () => {
    const ok = await confirmar({ titulo: 'Borrar agente', html: `<p>Se borra a <b>${esc(nombreAgente(existente))}</b>${nLics ? ` y sus <b>${plural(nLics, 'licencia')}</b>` : ''}.</p><p class="small muted">Si dejó de trabajar en la institución, conviene marcarlo como "dado de baja" en lugar de borrarlo, así conserva el historial.</p>`, ok: 'Borrar agente', peligro: true });
    if (!ok) return;
    const t = ahora();
    mutar(e => { const ag = e.agentes.find(x => x.id === id); ag.borrado = true; ag.modificado = t; e.licencias.forEach(l => { if (l.agenteId === id && !l.borrado) { l.borrado = true; l.borradoCon = id; l.modificado = t; } }); }, {
      msg: 'Agente borrado.', redibujar: false,
      deshacer: () => mutar(e => { const ag = e.agentes.find(x => x.id === id); ag.borrado = false; tocar(ag); e.licencias.forEach(l => { if (l.borradoCon === id) { l.borrado = false; delete l.borradoCon; tocar(l); } }); }, { msg: 'Agente recuperado.' }),
    });
    ir('#agentes'); render();
  };
}
